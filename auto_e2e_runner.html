<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E2E Visual Test - VNR202</title>
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0E0E12; color: #fff; font-family: sans-serif; overflow-x: hidden; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="game-frame" src="index.html"></iframe>

  <script>
    const frame = document.getElementById('game-frame');
    const urlParams = new URLSearchParams(window.location.search);
    const targetW = urlParams.get('w');
    if (targetW) {
      frame.style.position = 'fixed';
      frame.style.left = '0';
      frame.style.top = '0';
      frame.style.width = targetW + 'px';
      frame.style.height = (urlParams.get('h') || '844') + 'px';
    }

    frame.addEventListener('load', async () => {
      setTimeout(() => {
        const win = frame.contentWindow;
        const app = win.app;
        const step = urlParams.get('step') || 'home';

      console.log("[E2E] Running step:", step);

      if (step === 'candy_timer') {
        // Chuyển sang màn hình thi đấu của người chơi và mở Candy Quest
        app.playerName = "Chiến Sĩ Quyết Thắng";
        app.playerScore = 7500;
        app.switchView('view-player-game');
        app.triggerCandyQuest();
      } else if (step === 'candy_timeout') {
        // Chuyển sang màn hình thi đấu và kích hoạt hết giờ 10s
        app.playerName = "Chiến Sĩ Quyết Thắng";
        app.playerScore = 7500;
        app.switchView('view-player-game');
        app.triggerCandyQuest();
        // Gọi timeout ngay
        app.handleCandyQuestTimeout();
      } else if (step === 'host_podium') {
        // Chuyển sang màn hình Bảng Vàng vinh danh Top 3
        app.hostPlayers = {
          'p1': { id: 'p1', name: 'Nguyễn Văn Nhất', score: 28500, avatar: '🦁' },
          'p2': { id: 'p2', name: 'Trần Thị Nhì', score: 21000, avatar: '🐯' },
          'p3': { id: 'p3', name: 'Lê Văn Ba', score: 16500, avatar: '🦅' },
          'p4': { id: 'p4', name: 'Phạm Văn Bốn', score: 9000, avatar: '🐺' }
        };
        app.renderHostPodium();
        app.switchView('view-host-podium');
      } else if (step === 'session_recovery') {
        // Giả lập khôi phục phiên người chơi sau khi F5
        const sessionState = {
          role: 'player',
          id: 'test_p_1',
          name: 'Đồng Chí Khôi Phục',
          avatar: '⚡',
          roomCode: '194599',
          score: 15400,
          streak: 3,
          correctCount: 6,
          answeredCount: 7,
          currentQIndex: 6,
          timerRemaining: 215,
          view: 'view-player-game'
        };
        app.restorePlayerSession(sessionState);
      } else if (step === 'player_waiting') {
        app.playerName = "Chiến Sĩ Quyết Thắng";
        app.playerAvatar = "🦁";
        app.playerRoomCode = "194588";
        win.document.getElementById('display-player-name').textContent = app.playerName;
        win.document.getElementById('display-player-avatar').textContent = app.playerAvatar;
        win.document.getElementById('display-waiting-room').textContent = app.playerRoomCode;
        app.switchView('view-player-waiting');
      } else if (step === 'player_join') {
        app.switchView('view-player-join');
      } else if (step === 'player_finished') {
        app.playerScore = 18500;
        app.playerStreakMax = 5;
        app.playerCorrectCount = 8;
        app.playerAnsweredCount = 10;
        win.document.getElementById('final-player-score').textContent = '18,500';
        win.document.getElementById('final-player-correct-count').textContent = '8';
        app.switchView('view-player-finished');
      } else if (step === 'host_lobby') {
        app.hostRoomCode = "194588";
        app.hostPlayers = {
          'p1': { id: 'p1', name: 'Nguyễn Văn Nhất', score: 0, avatar: '🦁' },
          'p2': { id: 'p2', name: 'Trần Thị Nhì', score: 0, avatar: '🐯' },
          'p3': { id: 'p3', name: 'Lê Văn Ba', score: 0, avatar: '🦅' }
        };
        win.document.getElementById('host-room-pin-text').textContent = '194588';
        win.document.getElementById('host-lobby-player-count-num').textContent = '3';
        app.renderHostLobbyPlayers();
        app.switchView('view-host-lobby');
      } else if (step === 'host_live') {
        app.hostRoomCode = "194588";
        app.hostPlayers = {
          'p1': { id: 'p1', name: 'Nguyễn Văn Nhất', score: 18500, avatar: '🦁', streak: 4, correctCount: 7, count: 8 },
          'p2': { id: 'p2', name: 'Trần Thị Nhì', score: 12000, avatar: '🐯', streak: 2, correctCount: 5, count: 6 },
          'p3': { id: 'p3', name: 'Lê Văn Ba', score: 9500, avatar: '🦅', streak: 1, correctCount: 4, count: 5 }
        };
        app.hostIsRunning = true;
        app.hostTimerRemaining = 240;
        app.switchView('view-host-live');
        app.renderHostLiveLeaderboard();
      }

      setTimeout(() => {
        const doc = frame.contentDocument;
        const w = doc.documentElement.clientWidth;
        const bad = [];
        doc.querySelectorAll('*').forEach(el => {
          const r = el.getBoundingClientRect();
          if (r.right > w + 1 || el.scrollWidth > w + 1) {
            bad.push({
              tag: el.tagName,
              id: el.id || '',
              cls: typeof el.className === 'string' ? el.className.split(' ').slice(0, 2).join('.') : '',
              right: Math.round(r.right),
              w: Math.round(r.width),
              scrollW: el.scrollWidth
            });
          }
        });
        const pre = document.createElement('pre');
        pre.id = 'overflow-results';
        pre.textContent = JSON.stringify({ step, clientW: w, overflows: bad.slice(0, 15) });
        document.body.appendChild(pre);
      }, 150);

      document.title = "READY_" + step;
      }, 300);
    });
  </script>
</body>
</html>
